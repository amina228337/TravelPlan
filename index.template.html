<!-- Booking Detail Modal -->
<div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
  <div class="card-gradient rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 z-20 flex items-center justify-between px-5 pt-5 pb-3 bg-[#14233c]/95 backdrop-blur border-b border-white/10 rounded-t-2xl">
      <span class="text-xs text-slate-500 uppercase tracking-widest">Детали поездки</span>
      <button onclick="closeDetailModal()" class="text-2xl hover:text-sky-400 transition leading-none">×</button>
    </div>
    <div id="detail-modal-content" class="px-5 pb-6 pt-4"></div>
  </div>
</div>

<!-- Feed Item Detail Modal -->
<div id="feed-detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
  <div class="card-gradient rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 z-20 flex items-center justify-between px-5 pt-5 pb-3 bg-[#14233c]/95 backdrop-blur border-b border-white/10 rounded-t-2xl">

    </div>

  </div>
</div>

<!-- City Selector Modal -->
<div id="city-selector-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
  <div class="card-gradient rounded-2xl max-w-sm w-full max-h-[72vh] overflow-hidden flex flex-col">
    <div class="flex items-center justify-between px-5 pt-5 pb-3 flex-shrink-0">
      <h3 class="text-lg font-bold">📍 Ваш город</h3>
      <button onclick="closeCitySelector()" class="text-2xl hover:text-sky-400 transition leading-none">×</button>
    </div>
    <p class="text-slate-400 text-sm px-5 pb-3 flex-shrink-0">Выберите город отправления - цены и поле «Откуда» будут заполнены автоматически.</p>
    <div class="px-5 pb-5 space-y-2 overflow-y-auto min-h-0" id="city-selector-list"></div>
  </div>
</div>

<!-- City modal -->
<div id="city-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">

  </div>
</div>

<!-- Kaspi QR modal -->
<div id="kaspi-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden items-center justify-center p-4" style="display:none">

    <div id="kaspi-modal-content"></div>
  </div>
</div>
