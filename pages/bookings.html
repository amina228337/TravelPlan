<!-- Зачем этот файл: Страница броней пользователя. -->
<!-- BEGIN pages/bookings.html -->
  <section id="bookings-section" class="px-6 py-12 hidden">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl md:text-3xl font-bold mb-2 text-center">📋 Мои бронирования</h2>
      <p class="text-center text-slate-400 text-sm mb-8">Лимит: <span id="booking-count">0</span> / 10 бронирований</p>

      <div id="bookings-empty" class="card-gradient rounded-2xl p-12 text-center">
        <div class="text-6xl mb-4">🧳</div>
        <h3 class="text-xl font-semibold mb-2">Пока нет бронирований</h3>
        <p class="text-slate-400 mb-6">Начните планировать своё путешествие!</p>
        <button onclick="showSection('explore')" class="px-6 py-3 bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl font-semibold hover:from-sky-400 hover:to-blue-500 transition">
          Исследовать направления
        </button>
      </div>
      <div id="bookings-list" class="space-y-4 hidden"></div>
    </div>
  </section>
  <!-- END pages/bookings.html -->
