<!-- HEADER -->
  <header class="px-6 py-4 flex items-center justify-between border-b border-white/10 flex-shrink-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showSection('explore')">
      <img src="assets/images/travelplan-logo.png" alt="TravelPlan" class="w-10 h-10 rounded-xl object-cover shadow-[0_0_18px_rgba(56,189,248,0.25)]">
      <span id="site-title" class="text-xl font-bold">TravelPlan</span>
    </div>
    <nav class="hidden md:flex items-center gap-6">
      <button onclick="showSection('explore')"  class="hover:text-sky-400 transition">Исследовать</button>
      <button onclick="showSection('feed')"     class="hover:text-sky-400 transition">Лента</button>
      <button onclick="showSection('flights')"  class="hover:text-sky-400 transition">Билеты</button>
      <button onclick="showSection('hotels')"   class="hover:text-sky-400 transition">Отели</button>
      <button onclick="showSection('places')"   class="hover:text-sky-400 transition">Места</button>
      <button onclick="showSection('bookings')" class="hover:text-sky-400 transition">Мои поездки</button>
      <button id="auth-profile-btn" onclick="openAuthModal()"
        class="flex items-center gap-2 px-3 py-1.5 bg-white/10 border border-white/15 rounded-full text-slate-200 text-sm hover:bg-white/20 transition font-medium">
        👤 Войти
      </button>
    </nav>
    <div class="flex items-center gap-2 md:hidden">
      <button id="auth-profile-btn-mob" onclick="openAuthModal()"
        class="flex items-center gap-1 px-2 py-1 bg-white/10 border border-white/15 rounded-full text-slate-200 text-xs hover:bg-white/20 transition">
        👤
      </button>
      <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="text-2xl">☰</button>
    </div>
  </header>

  <!-- MOBILE MENU -->
  <div id="mobile-menu" class="hidden md:hidden bg-slate-800/95 border-b border-white/10">
    <div class="flex flex-col p-4 gap-3">
      <button onclick="showSection('explore');  toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">🌍 Исследовать</button>
      <button onclick="showSection('feed');     toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">📰 Лента поездок</button>
      <button onclick="showSection('flights');  toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">✈️ Билеты</button>
      <button onclick="showSection('hotels');   toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">🏨 Отели</button>
      <button onclick="showSection('places');   toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">🗺️ Интересные места</button>
      <button onclick="showSection('bookings'); toggleMobileMenu()" class="text-left py-2 hover:text-sky-400">📋 Мои поездки</button>
    </div>
  </div>
