<!-- ===== MODALS ===== -->

  <!-- Booking confirmation -->
  <div id="booking-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
    <div class="card-gradient rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 z-20 flex items-center justify-between px-5 pt-5 pb-3 bg-[#14233c]/95 backdrop-blur border-b border-white/10 rounded-t-2xl">
        <span class="text-xs text-slate-500 uppercase tracking-widest">Бронирование</span>
        <button onclick="closeModal()" class="text-2xl hover:text-sky-400 transition leading-none">×</button>
      </div>
      <div id="modal-content" class="px-5 pb-6 pt-4"></div>
    </div>
  </div>

  <!-- Delete confirm -->
  <div id="delete-confirm" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
    <div class="card-gradient rounded-2xl p-6 max-w-sm w-full">
      <h3 class="text-xl font-bold mb-4">Отменить бронирование?</h3>
      <p class="text-slate-400 mb-6">Это действие нельзя отменить.</p>
      <div class="flex gap-4">
        <button onclick="closeDeleteConfirm()" class="flex-1 py-3 bg-slate-700 rounded-xl font-semibold hover:bg-slate-600 transition">Нет</button>
        <button id="confirm-delete-btn" class="flex-1 py-3 bg-red-500 rounded-xl font-semibold hover:bg-red-600 transition">Да, отменить</button>
      </div>
    </div>
  </div>


  <!-- Place detail -->
  <div id="place-detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4" style="display:none">
    <div class="card-gradient rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 z-20 flex items-center justify-between px-5 pt-5 pb-3 bg-[#14233c]/95 backdrop-blur border-b border-white/10 rounded-t-2xl">
        <span class="text-xs text-slate-500 uppercase tracking-widest">Интересное место</span>
        <button onclick="closePlaceDetailModal()" class="text-2xl hover:text-sky-400 transition leading-none">×</button>
      </div>
      <div id="place-detail-content" class="px-5 pb-6 pt-4"></div>
    </div>
  </div>


  <!-- Auth / Profile modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[70] hidden items-center justify-center p-4" style="display:none">
    <div class="card-gradient rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 z-20 flex items-center justify-between px-5 pt-5 pb-3 bg-[#14233c]/95 backdrop-blur border-b border-white/10 rounded-t-2xl">
        <span class="text-xs text-slate-500 uppercase tracking-widest">Аккаунт</span>
        <button onclick="closeAuthModal()" class="text-2xl hover:text-sky-400 transition leading-none">×</button>
      </div>
      <div id="auth-modal-content" class="px-5 pb-6 pt-4"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 text-white px-6 py-3 rounded-xl shadow-lg translate-y-20 opacity-0 transition-all duration-300 z-50 bg-emerald-500">
    <span id="toast-message"></span>
  </div>
