<!-- Зачем этот файл: Страница поиска авиабилетов. -->
<!-- BEGIN pages/flights.html -->
  <section id="flights-section" class="px-6 py-12 hidden">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl md:text-3xl font-bold mb-8 text-center">✈️ Поиск авиабилетов</h2>
      <div class="card-gradient rounded-2xl p-6 md:p-8 glow">
        <form id="flight-form" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="relative">
              <label class="block text-sm text-slate-400 mb-2">Откуда</label>
              <input type="text" id="flight-from" placeholder="Город отправления" autocomplete="off"
                class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
              <div id="flight-from-suggestions" class="autocomplete-list hidden"></div>
            </div>
            <div class="relative">
              <label class="block text-sm text-slate-400 mb-2">Куда</label>
              <input type="text" id="flight-to" placeholder="Город назначения" autocomplete="off"
                class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
              <div id="flight-to-suggestions" class="autocomplete-list hidden"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm text-slate-400 mb-2">Дата вылета</label>
              <input type="date" id="flight-date-from"
                class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm text-slate-400 mb-2">Дата возврата</label>
              <input type="date" id="flight-date-to"
                class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm text-slate-400 mb-2">Пассажиры</label>
              <select id="flight-passengers" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
                <option value="1">1 пассажир</option>
                <option value="2">2 пассажира</option>
                <option value="3">3 пассажира</option>
                <option value="4">4 пассажира</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full py-4 bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl font-semibold text-lg hover:from-sky-400 hover:to-blue-500 transition transform hover:scale-[1.02]">
            🔍 Найти билеты
          </button>
        </form>
      </div>
      <div id="flight-results" class="mt-8 space-y-4 hidden">
        <h3 class="text-xl font-semibold mb-4">Доступные рейсы</h3>
        <div id="flight-results-list" class="space-y-4"></div>
      </div>
    </div>
  </section>
  <!-- END pages/flights.html -->
