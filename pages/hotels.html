<!-- Зачем этот файл: Страница поиска отелей. -->
<!-- BEGIN pages/hotels.html -->
  <section id="hotels-section" class="px-6 py-12 hidden">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl md:text-3xl font-bold mb-8 text-center">🏨 Поиск отелей</h2>
      <div class="card-gradient rounded-2xl p-6 md:p-8 glow">
        <form id="hotel-form" class="space-y-6">
          <div class="relative">
            <label class="block text-sm text-slate-400 mb-2">Город или отель</label>
            <input type="text" id="hotel-destination" placeholder="Куда вы едете?" autocomplete="off"
              class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
            <div id="hotel-destination-suggestions" class="autocomplete-list hidden"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm text-slate-400 mb-2">Заезд</label>
              <input type="date" id="hotel-checkin" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm text-slate-400 mb-2">Выезд</label>
              <input type="date" id="hotel-checkout" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm text-slate-400 mb-2">Гости</label>
              <select id="hotel-guests" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:border-sky-500 focus:outline-none transition">
                <option value="1">1 гость</option>
                <option value="2">2 гостя</option>
                <option value="3">3 гостя</option>
                <option value="4">4 гостя</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full py-4 bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl font-semibold text-lg hover:from-sky-400 hover:to-blue-500 transition transform hover:scale-[1.02]">
            🔍 Найти отели
          </button>
        </form>
      </div>
      <div id="hotel-results" class="mt-8 space-y-4 hidden">
        <h3 class="text-xl font-semibold mb-4">Доступные отели</h3>
        <div id="hotel-results-list" class="space-y-4"></div>
      </div>
    </div>
  </section>
  <!-- END pages/hotels.html -->
